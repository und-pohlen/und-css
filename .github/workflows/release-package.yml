name: Publish Package to npmjs

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for npm Trusted Publishing (OIDC)
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Do not set registry-url: setup-node would write an empty _authToken into
      # .npmrc and that blocks npm Trusted Publishing OIDC (ENEEDAUTH).
      # See actions/setup-node#1551.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: yarn
      - run: yarn install --frozen-lockfile
      # Prereleases (e.g. 1.0.0-rc.4) need an explicit dist-tag; stables publish to latest.
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            TAG=${VERSION##*-}
            TAG=${TAG%%.*}
            npm publish --tag "$TAG"
          else
            npm publish
          fi
