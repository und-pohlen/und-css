name: Lint
on: [push]

jobs:
  yarn-lint:
    name: yarn lint
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: yarn
    - name: yarn
      run: yarn install --frozen-lockfile
    - name: lint
      run: yarn run lint
    - name: build:styles
      run: yarn run build:styles
